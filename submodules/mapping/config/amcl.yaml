amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    max_particles: 2000
    min_particles: 500
    update_min_a: 0.10
    update_min_d: 0.10
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    laser_model_type: likelihood_field
    laser_max_range: 100.0
    laser_likelihood_max_dist: 2.0
    robot_model_type: "nav2_amcl::OmniMotionModel"
