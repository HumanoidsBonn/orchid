sensors:
  - head_rgbd_sensor

head_rgbd_sensor:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /filtered_depth_cloud
  max_range: 2.0 # 5.0
  point_subsample: 2 # 1
  padding_offset: 0.1
  padding_scale: 1.0
  queue_size: 10 # 100
  max_update_rate: 5.0
  filtered_cloud_topic: /head_rgbd_sensor/depth_registered/filtered_cloud

