sensors:
  - head_rgbd_sensor

head_rgbd_sensor:
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  image_topic: /head_rgbd_sensor/depth_registered/image_rect_raw
  queue_size: 10
  near_clipping_plane_distance: 0.5
  far_clipping_plane_distance: 2.0
  shadow_threshold: 0.2
  padding_offset: 0.1
  padding_scale: 1.0
  max_update_rate: 1.0
  filtered_cloud_topic: /head_rgbd_sensor/depth_registered/filtered_cloud
