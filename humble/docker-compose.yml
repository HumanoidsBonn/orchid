version: '3.8'

services:
  # ros2-humble-orchid:
  orchid-server:
    build:
      context: ..
      dockerfile: humble/Dockerfile
    image: registry.gitlab.uni-bonn.de:5050/s52sgupt/ovmm_images/orchid_image:latest
    container_name: orchid_server
    network_mode: host
    ipc: host
    env_file:
      - ../.env.manifest
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=${XAUTHORITY:-/tmp/.Xauthority}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-5}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=/home/orchid/cyclonedds.xml
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.Xauthority}:${XAUTHORITY:-/tmp/.Xauthority}:rw
      - ./cyclonedds.xml:/home/orchid/cyclonedds.xml:rw
      - ../.:/home/orchid/orchid_server:rw
      - /home/orchid/orchid_server/.venv
      - ../submodules/gpd_ros2/gpd_ros2:/home/orchid/ros2_ws/src/gpd_ros2:rw
      - ../submodules/gpd_ros2/gpd_ros2_msgs:/home/orchid/ros2_ws/src/gpd_ros2_msgs:rw
      - ../submodules/mapping:/home/orchid/ros2_ws/src/orchid_mapping_config:rw
      - ../submodules/nav2_config:/home/orchid/ros2_ws/src/orchid_nav2_config:rw
      - ../submodules/orchid_moveit_config:/home/orchid/ros2_ws/src/orchid_moveit_config:rw
      - ../submodules/orchid_utils:/home/orchid/ros2_ws/src/orchid_utils:rw
      - ../submodules/orchid_ui/ros2_ws/src/orchid_ros_interfaces:/home/orchid/ros2_ws/src/orchid_ros_interfaces:rw
      - ../submodules/orchid_hsr_pickup/orchid_hsr_pickup:/home/orchid/ros2_ws/src/orchid_hsr_pickup:rw
      - ../submodules/orchid_hsr_pickup/orchid_hsr_pickup_interfaces:/home/orchid/ros2_ws/src/orchid_hsr_pickup_interfaces:rw
      - orchid_ros2_ws_build:/home/orchid/ros2_ws/build
      - orchid_ros2_ws_install:/home/orchid/ros2_ws/install
      - orchid_ros2_ws_log:/home/orchid/ros2_ws/log
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    # gpus: all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  orchid_ros2_ws_build:
  orchid_ros2_ws_install:
  orchid_ros2_ws_log:
